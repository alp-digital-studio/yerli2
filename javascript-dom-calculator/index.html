
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="header">
            <h2>CALCULATOR</h2>
            <span>JS PROJECT</span>
        </div>

        <div class="display">
            <div id="previous"></div>
            <div id="display">0</div>
        </div>

        <div class="buttons">

            <button class="function" data-action="clear">C</button>
            <button class="function" data-action="delete">⌫</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button class="function" data-action="sign">±</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equal" data-action="calculate">=</button>

        </div>

        <div class="history">
            <h3>Calculation History</h3>
            <ul id="historyList"></ul>
        </div>

        <div class="footer">
            Designed by Vuqar Ismayilov
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
